[project]
name = "sumry"
version = "0.5.3"
description = "A tool for getting a file summary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "geopandas>=0.14.0",
    "pyogrio>=0.7.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.4.4",
    "laspy[lazrs]>=2.7.0",
    "pmtiles>=3.8.1",
    "numpy>=1.24",
]

[project.scripts]
sumry = "sumry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
